name: Supabase Keepalive

on:
  schedule:
    - cron: "17 4 * * *"
    - cron: "17 16 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase-backed stats endpoint
        env:
          KEEPALIVE_URL: https://worship-progressions-app-experiment.vercel.app/api/stats
        run: |
          status=$(curl -sS -o response.json -w "%{http_code}" \
            "$KEEPALIVE_URL")

          cat response.json

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Keepalive failed with status $status"
            exit 1
          fi
