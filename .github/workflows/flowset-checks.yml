name: Flowset checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/worship-progressions-app-experimental
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/worship-progressions-app-experimental/package-lock.json
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test
